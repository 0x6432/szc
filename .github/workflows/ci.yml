name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror
      - name: Release build
        run: make clean && make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror release
      - name: Tests under ASan + UBSan
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror test
      - name: Build pinned QBE
        run: |
          CC=${{ matrix.cc }} tools/build_qbe.sh
          echo "PATH=$PWD/build/qbe-src:$PATH" >> "$GITHUB_ENV"
      - name: End-to-end and driver tests under ASan + UBSan
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror e2e-test
      - name: Standalone fuzz replay
        timeout-minutes: 15
        run: make CC=${{ matrix.cc }} fuzz-standalone
      - name: Upload standalone fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-fuzz-inputs-${{ matrix.cc }}
          path: build/fuzz-last-*.bin
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libFuzzer targets
        run: make FUZZ_CC=clang fuzz
      - name: Fuzz (60s per target on push, 30min nightly)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            make FUZZ_CC=clang FUZZ_SECONDS=1800 fuzz-run
          else
            make FUZZ_CC=clang FUZZ_SECONDS=60 fuzz-run
          fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  differential-suite:
    name: differential suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - native
          - storage
          - alignment
          - safety-0
          - safety-1
          - safety-2
          - safety-3
          - parser
          - diff_pointer_coercions
          - diff_pointer_allowzero
          - diff_pointer_alignment
          - diff_local_alignment
          - diff_const_alignment
          - diff_global_alignment
          - diff_global_const_alignment
          - diff_function_alignment
          - diff_volatile_pointers
          - diff_function_pointers
          - diff_sentinel_pointers
          - diff_sentinel_slices
          - diff_sentinel_assertions
          - diff_ptr_from_int
          - diff_qualifier_casts
          - diff_alignment_casts
          - diff_scalar_bitcasts
          - diff_slice_fields
          - diff_slice_deref
          - diff_slicing
          - diff_slices
          - diff_arrays
          - diff_array_sentinels
    steps:
      - uses: actions/checkout@v4
      - name: Download Zig 0.17.0
        run: |
          curl -sSfL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz | tar -xJ
          echo "ZIG=$PWD/zig-x86_64-linux-0.17.0/zig" >> "$GITHUB_ENV"
      - name: Build szc with warnings as errors
        run: make EXTRA_CFLAGS=-Werror all asan
      - name: Build pinned QBE for native comparisons
        if: contains(fromJSON('["native", "storage", "alignment", "safety-0", "safety-1", "safety-2", "safety-3"]'), matrix.suite)
        run: |
          tools/build_qbe.sh
          echo "PATH=$PWD/build/qbe-src:$PATH" >> "$GITHUB_ENV"
      - name: Compare native programs with Zig 0.17.0
        if: contains(fromJSON('["native", "storage", "alignment", "safety-0", "safety-1", "safety-2", "safety-3"]'), matrix.suite)
        run: |
          suite="${{ matrix.suite }}"
          if [[ "$suite" == safety-* ]]; then
            python3 tests/run_safety.py build/asan/szc --shard-index "${suite#safety-}" --shard-count 4
          else
            make EXTRA_CFLAGS=-Werror "e2e-${suite}-test"
          fi
      - name: Compare semantic acceptance and types
        if: startsWith(matrix.suite, 'diff_')
        run: python3 "tools/${{ matrix.suite }}.py" build/asan/szc "$ZIG"
      - name: Build the reference span dumper
        if: matrix.suite == 'parser'
        run: '"$ZIG" build-exe tools/ast_spans.zig -OReleaseFast -femit-bin=build/ast_spans'
      - name: Compare AST node spans with std.zig.Ast over the Zig lib
        if: matrix.suite == 'parser'
        run: |
          find zig-x86_64-linux-0.17.0/lib -name '*.zig' | sort > build/zig-files.txt
          tools/diff_ast_spans.sh build/szc build/ast_spans build/zig-files.txt
      - name: Accept/reject differential on mutated Zig sources
        if: matrix.suite == 'parser'
        run: python3 tools/diff_parse_errors.py build/szc build/ast_spans build/zig-files.txt 1000 "$GITHUB_RUN_NUMBER"
      - name: Upload disagreeing mutants
        if: failure() && matrix.suite == 'parser'
        uses: actions/upload-artifact@v4
        with:
          name: parse-diff
          path: build/parse-diff

  differential:
    name: differential
    needs: differential-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all reference suites to pass
        run: test "${{ needs.differential-suite.result }}" = success
