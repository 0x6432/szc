name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror
      - name: Release build
        run: make clean && make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror release
      - name: Tests under ASan + UBSan
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror test
      - name: Build pinned QBE
        run: |
          CC=${{ matrix.cc }} tools/build_qbe.sh
          echo "PATH=$PWD/build/qbe-src:$PATH" >> "$GITHUB_ENV"
      - name: End-to-end and driver tests under ASan + UBSan
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror e2e-test
      - name: Standalone fuzz replay
        run: make CC=${{ matrix.cc }} fuzz-standalone

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libFuzzer targets
        run: make FUZZ_CC=clang fuzz
      - name: Fuzz (60s per target on push, 30min nightly)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            make FUZZ_CC=clang FUZZ_SECONDS=1800 fuzz-run
          else
            make FUZZ_CC=clang FUZZ_SECONDS=60 fuzz-run
          fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Zig 0.17.0
        run: |
          curl -sSfL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz | tar -xJ
          echo "ZIG=$PWD/zig-x86_64-linux-0.17.0/zig" >> "$GITHUB_ENV"
      - name: Build szc and the reference span dumper
        run: |
          make
          "$ZIG" build-exe tools/ast_spans.zig -OReleaseFast -femit-bin=build/ast_spans
      - name: Build pinned QBE
        run: |
          tools/build_qbe.sh
          echo "PATH=$PWD/build/qbe-src:$PATH" >> "$GITHUB_ENV"
      - name: Compare native programs with Zig 0.17.0
        run: make e2e-test
      - name: Compare nested pointer qualifier coercions
        run: python3 tools/diff_pointer_coercions.py build/asan/szc "$ZIG"
      - name: Compare allowzero pointer coercions and joins
        run: python3 tools/diff_pointer_allowzero.py build/asan/szc "$ZIG"
      - name: Compare aligned pointer coercions and joins
        run: python3 tools/diff_pointer_alignment.py build/asan/szc "$ZIG"
      - name: Compare local storage alignment and pointer coercions
        run: python3 tools/diff_local_alignment.py build/asan/szc "$ZIG"
      - name: Compare aligned constant bindings and addresses
        run: python3 tools/diff_const_alignment.py build/asan/szc "$ZIG"
      - name: Compare aligned mutable global declarations
        run: python3 tools/diff_global_alignment.py build/asan/szc "$ZIG"
      - name: Compare aligned global constants
        run: python3 tools/diff_global_const_alignment.py build/asan/szc "$ZIG"
      - name: Compare aligned function addresses
        run: python3 tools/diff_function_alignment.py build/asan/szc "$ZIG"
      - name: Compare volatile pointer qualifiers and joins
        run: python3 tools/diff_volatile_pointers.py build/asan/szc "$ZIG"
      - name: Compare function-pointer signatures and qualifiers
        run: python3 tools/diff_function_pointers.py build/asan/szc "$ZIG"
      - name: Compare AST node spans with std.zig.Ast over the Zig lib
        run: |
          find zig-x86_64-linux-0.17.0/lib -name '*.zig' | sort > build/zig-files.txt
          tools/diff_ast_spans.sh build/szc build/ast_spans build/zig-files.txt
      - name: Accept/reject differential on mutated Zig sources
        run: python3 tools/diff_parse_errors.py build/szc build/ast_spans build/zig-files.txt 1000 "$GITHUB_RUN_NUMBER"
      - name: Upload disagreeing mutants
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parse-diff
          path: build/parse-diff
